<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Email Verified — FemmeSuite</title>
  <meta name="description" content="Your FemmeSuite email has been verified. Return to the app to continue.">
  <link rel="icon" href="/femmesuite-site/femmesuite-logo-assets/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="/femmesuite-site/femmesuite-logo-assets/favicon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/femmesuite-site/femmesuite-logo-assets/apple-touch-icon.png">
  <meta name="theme-color" content="#0b0b0b">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
      background:#0b0b0b;color:#fff;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px}
    .card{background:#111;border:1px solid #222;border-radius:24px;max-width:420px;width:100%;
      padding:48px 32px 40px;text-align:center;box-shadow:0 16px 48px rgba(0,0,0,.45)}
    .logo{width:80px;height:80px;border-radius:20px;margin:0 auto 28px;display:block}
    .check{width:56px;height:56px;margin:0 auto 20px;display:flex;align-items:center;justify-content:center;
      background:rgba(236,72,153,.14);border-radius:50%}
    .check svg{width:28px;height:28px}
    h1{font-size:1.65rem;font-weight:800;letter-spacing:-.02em;margin-bottom:10px}
    .body-text{color:#a1a1aa;font-size:1.05rem;line-height:1.6;margin-bottom:28px}
    .cta{display:inline-block;background:#ec4899;color:#0b0b0b;font-weight:700;font-size:1.05rem;
      padding:14px 36px;border-radius:999px;text-decoration:none;transition:background .15s}
    .cta:hover{background:#f472b6}
    .helper{margin-top:18px;color:#71717a;font-size:.88rem;line-height:1.55;max-width:340px;margin-left:auto;margin-right:auto}
    .footer-line{margin-top:36px;color:#52525b;font-size:.8rem;letter-spacing:.02em}
  </style>
</head>
<body>
  <div class="card">
    <img class="logo"
         src="https://kewofiqoezgrxfrasdeo.supabase.co/storage/v1/object/public/Femmesuite%20Brand%20Logo/femmesuite-appicon-pink-on-black.png?v=2"
         alt="FemmeSuite logo"
         width="80" height="80">

    <div class="check">
      <svg viewBox="0 0 24 24" fill="none" stroke="#ec4899" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"/>
      </svg>
    </div>

    <h1>Email verified ✨</h1>
    <p class="body-text">Your account is confirmed. You can now close this browser and return to the FemmeSuite app.</p>

    <a class="cta" href="femmesuite://auth-callback?verified=1">Open FemmeSuite app</a>

    <p class="helper">If the button doesn't work, simply switch back to the app — it will automatically detect your verification.</p>

    <p class="footer-line">FemmeSuite — The business suite for beauty professionals.</p>
  </div>

  <script>
    // Auto deep-link after 2 seconds
    setTimeout(function () {
      window.location.href = 'femmesuite://auth-callback?verified=1';
    }, 2000);
  </script>
</body>
</html>
